version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: jdf_sdh-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jdf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  notebook:
    build: .
    image: jdf_sdh:latest
    depends_on:
      - postgres
    ports:
      - "8888:8888"
    volumes:
      - ./:/workspace
    working_dir: /workspace
    env_file:
      - .env
    # Default command runs Jupyter Notebook as defined in Dockerfile

volumes:
  pgdata:
